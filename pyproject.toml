[project]
name = "andre-mcp"
version = "0.1.0"
description = "Serveur MCP pour l'analyse électorale française (1999-2026)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mcp>=1.20",
    "duckdb>=1.4",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "platformdirs>=4.0",
    "prometheus-client>=0.22",
    "requests>=2.31",
    "tqdm>=4.66",
    "click>=8.0",
]

[project.optional-dependencies]
maps = ["geopandas>=0.14", "matplotlib>=3.10", "topojson>=1.10"]
viz = ["plotly>=5.0"]
analysis = ["scikit-learn>=1.3", "statsmodels>=0.14"]
full = ["andre-mcp[maps,viz,analysis]"]

[project.scripts]
andre-mcp = "andre_mcp.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
